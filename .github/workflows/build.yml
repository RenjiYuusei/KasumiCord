name: Build KasumiCord

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build KasumiCord
        run: bun scripts/build.mjs

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kasumicord-dist
          path: |
            dist/kasumicord.js
            dist/kasumicord.min.js
          if-no-files-found: error
